name: XAU-SMC Gold Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run price check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server.js

      - name: Commit updated state
        run: |
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add candles.json state.json
          git diff --quiet --cached || git commit -m "update candle state [skip ci]"
          git push
