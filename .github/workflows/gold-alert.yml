name: XAU-SMC Gold Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run one-shot XAUUSD M5 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server.js

      - name: Commit state
        shell: bash
        run: |
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xauusd_m5.json state_v2.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update XAUUSD alert state [skip ci]"
            git push
          fi
