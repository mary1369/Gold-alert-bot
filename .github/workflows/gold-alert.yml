name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'TELEGRAM_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }

      - name: Refresh XAUUSD M5 data
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
          URL_Q2='https://query2.finance.yahoo.com/v8/finance/chart/XAUUSD=X?interval=5m&range=5d&events=div%2Csplits'
          URL_Q1='https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X?interval=5m&range=5d&events=div%2Csplits'

          if curl -fsS --retry 1 --retry-delay 2 --max-time 25 -A "$UA" "$URL_Q2" -o /tmp/xau.json; then
            echo 'Yahoo query2 returned XAUUSD M5 data.'
          elif curl -fsS --retry 1 --retry-delay 2 --max-time 25 -A "$UA" "$URL_Q1" -o /tmp/xau.json; then
            echo 'Yahoo query1 returned XAUUSD M5 data.'
          else
            echo 'ERROR: Yahoo Finance rejected both chart endpoints (likely HTTP 429).'
            exit 22
          fi

          node scripts/parse_yahoo_xau.js

      - name: Syntax and dependency checks
        run: npm run check

      - name: Run XAUUSD V4 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node orderflow_gate.js

      - name: Commit state and refreshed candles
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xauusd_m5.json state_v2.json orderflow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'update XAUUSD V4 state [skip ci]'
            git push
          fi
