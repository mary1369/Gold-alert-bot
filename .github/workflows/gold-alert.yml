name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Telegram connectivity test (one time)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f telegram_test_sent.json ]; then
            echo "One-time Telegram test already sent; skipping."
            exit 0
          fi
          test -n "${TELEGRAM_TOKEN:-}" || { echo "TELEGRAM_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟢 Gold-alert-bot TEST — Telegram connection OK — one-time test" >/dev/null
          printf '{"sent":true,"type":"connectivity-test"}\n' > telegram_test_sent.json

      - name: Refresh XAUUSD M5 history (free, multi-TF ready)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=1000" -o /tmp/xau.json
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/xau.json','utf8'));
          if (!Array.isArray(j.bars)) throw new Error('Biquote: missing bars');
          const bars = j.bars.filter(b => !b.isOpen && [b.open,b.high,b.low,b.close].every(Number.isFinite))
            .map(b => ({time: Date.parse(b.openTime), open:b.open, high:b.high, low:b.low, close:b.close, volume:Number(b.tickVolume)||0}))
            .filter(b => Number.isFinite(b.time))
            .sort((a,b)=>a.time-b.time);
          if (bars.length < 300) throw new Error(`Biquote: only ${bars.length} closed M5 bars`);
          fs.writeFileSync('xauusd_m5.json', JSON.stringify(bars.slice(-1000), null, 2));
          console.log(`Loaded ${bars.length} closed XAUUSD M5 bars from Biquote`);
          NODE

      - name: Syntax check V3
        run: node --check server_v3.js

      - name: Strict safety gate
        run: node safety_gate_v4.js

      - name: Run XAUUSD V3 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server_v3.js

      - name: Commit state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xauusd_m5.json state_v2.json telegram_test_sent.json orderflow.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "refresh XAUUSD V3 data and alert state [skip ci]"
            git push
          fi
