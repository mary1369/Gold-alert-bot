name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Telegram connectivity test (one time)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f telegram_test_sent.json ]; then
            echo "One-time Telegram test already sent; skipping."
            exit 0
          fi
          test -n "${TELEGRAM_TOKEN:-}" || { echo "TELEGRAM_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟢 Gold-alert-bot TEST — Telegram connection OK — one-time test" >/dev/null
          printf '{"sent":true,"type":"connectivity-test"}\n' > telegram_test_sent.json

      - name: Run XAUUSD M5 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server.js

      - name: Commit state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xauusd_m5.json state_v2.json telegram_test_sent.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update XAUUSD alert state [skip ci]"
            git push
          fi
