name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'TELEGRAM_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }

      - name: Refresh XAUUSD M5 history
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "XAUUSD feed attempt $attempt/3"
            if node scripts/fetch_xau_history.js && node scripts/parse_yahoo_xau.js; then
              success=1
              break
            fi
            echo "Feed attempt $attempt failed; backing off..."
            sleep $((20 * attempt))
          done
          if [ "$success" -ne 1 ]; then
            echo 'Unable to obtain a fresh XAUUSD M5 feed. No signal will be generated.'
            exit 1
          fi
          node -e 'const x=require("./xauusd_m5.json"); if(!Array.isArray(x)||x.length<1200) throw new Error(`Invalid M5 history: ${x?.length||0}`); const age=Date.now()-x.at(-1).time; if(age<0||age>20*60*1000) throw new Error(`Stale M5 data: ${Math.round(age/60000)}m`); console.log(`Validated ${x.length} M5 bars; latest=${new Date(x.at(-1).time).toISOString()}`)'

      - name: Fetch fresh MT5 Order Flow (optional)
        env:
          MT5_ORDERFLOW_URL: ${{ secrets.MT5_ORDERFLOW_URL }}
          MT5_ORDERFLOW_KEY: ${{ secrets.MT5_ORDERFLOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f orderflow.json
          if [ -z "${MT5_ORDERFLOW_URL:-}" ]; then
            echo 'MT5 Order Flow unavailable/config not set; continuing without flow.'
            exit 0
          fi
          if [ -n "${MT5_ORDERFLOW_KEY:-}" ]; then
            curl -fsSL --max-time 10 -H "X-API-Key: ${MT5_ORDERFLOW_KEY}" "$MT5_ORDERFLOW_URL" -o orderflow.json || rm -f orderflow.json
          else
            curl -fsSL --max-time 10 "$MT5_ORDERFLOW_URL" -o orderflow.json || rm -f orderflow.json
          fi
          [ -f orderflow.json ] && echo 'Fresh MT5 Order Flow received.' || echo 'No fresh MT5 Order Flow; continuing without it.'

      - name: Syntax and dependency checks
        run: |
          npm run check
          node --check server_v5.js

      - name: Run XAUUSD V5 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server_v5.js

      - name: Commit state and refreshed candles
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xauusd_m5.json state_v2.json orderflow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'update XAUUSD V5 state [skip ci]'
            git push
          fi
