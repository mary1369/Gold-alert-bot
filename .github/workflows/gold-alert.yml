name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'TELEGRAM_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }

      - name: Refresh XAUUSD M5 data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 2 --max-time 25 \
            'https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X?interval=5m&range=5d' \
            -o /tmp/xau.json
          node scripts/parse_yahoo_xau.js

      - name: Syntax and dependency checks
        run: npm run check

      - name: Run XAUUSD V4 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node orderflow_gate.js

      - name: Commit state and refreshed candles
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xauusd_m5.json state_v2.json orderflow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'update XAUUSD V4 state [skip ci]'
            git push
          fi
