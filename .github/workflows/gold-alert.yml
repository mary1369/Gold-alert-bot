name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Telegram secrets are present
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_TOKEN:-}" || { echo "TELEGRAM_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }
          echo "Telegram secrets are configured."

      - name: Refresh XAUUSD M5 history from Yahoo
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/xau.json
          if curl -fsS --retry 2 --retry-delay 2 --max-time 25 \
            "https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X?interval=5m&range=5d" \
            -o /tmp/xau.json; then
            node <<'NODE'
const fs = require('fs');
const j = JSON.parse(fs.readFileSync('/tmp/xau.json', 'utf8'));
const z = j?.chart?.result?.[0];
const q = z?.indicators?.quote?.[0];
if (!z?.timestamp?.length || !q) throw new Error('Yahoo: missing XAUUSD 5m data');
const bars = [];
for (let i = 0; i < z.timestamp.length; i++) {
  const o = Number(q.open?.[i]);
  const h = Number(q.high?.[i]);
  const l = Number(q.low?.[i]);
  const c = Number(q.close?.[i]);
  const v = Number(q.volume?.[i]) || 0;
  if ([o, h, l, c].every(Number.isFinite)) bars.push({time: z.timestamp[i] * 1000, open: o, high: h, low: l, close: c, volume: v});
}
const out = bars.filter((b, i) => i === 0 || b.time > bars[i - 1].time).slice(-1200);
if (out.length < 300) throw new Error(`Yahoo: only ${out.length} valid M5 bars`);
fs.writeFileSync('xauusd_m5.json', JSON.stringify(out, null, 2));
console.log(`Loaded ${out.length} valid XAUUSD M5 bars from Yahoo`);
NODE
          else
            echo "Yahoo unavailable; using existing candle cache if it is valid."
            node <<'NODE'
const fs = require('fs');
if (!fs.existsSync('xauusd_m5.json')) throw new Error('No Yahoo data and no candle cache');
const bars = JSON.parse(fs.readFileSync('xauusd_m5.json', 'utf8'));
if (!Array.isArray(bars) || bars.length < 300) throw new Error(`Candle cache invalid or too small: ${bars.length || 0}`);
console.log(`Using cached XAUUSD M5 bars: ${bars.length}`);
NODE
          fi

      - name: Syntax and dependency checks
        run: npm run check

      - name: Run XAUUSD V4 analysis with strict real-MT5 Order Flow gate
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node orderflow_gate.js

      - name: Commit state and refreshed candles
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xauusd_m5.json state_v2.json orderflow.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update XAUUSD V4 state [skip ci]"
            git push
          fi
