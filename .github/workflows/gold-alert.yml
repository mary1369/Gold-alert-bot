name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch feed freshness validation for current direct spot feed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'scripts/fetch_xau_history.js';
          let s = fs.readFileSync(p, 'utf8');
          const old = "const directFresh=rows=>{const d=direct(rows);if(!d.length)return false;const age=NOW-Date.parse(d.at(-1).openTime);return age>=0&&age<=MAX_AGE&&NOW-Date.parse(d[0].openTime)<=DIRECT_WINDOW;};";
          const fixed = "const directFresh=rows=>{const d=direct(rows);if(!d.length)return false;const latest=Date.parse(d.at(-1).openTime);const age=NOW-latest;return age>=0&&age<=MAX_AGE;};";
          if (!s.includes(old)) throw new Error('Expected feed freshness gate was not found; refusing to patch.');
          fs.writeFileSync(p, s.replace(old, fixed));
          console.log('Applied direct-spot freshness fix in workflow workspace.');
          NODE

      - name: Validate Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'TELEGRAM_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }

      - name: Refresh XAUUSD M5 history
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "XAUUSD feed attempt $attempt/3"
            if node scripts/fetch_xau_history.js && node scripts/parse_yahoo_xau.js; then
              success=1
              break
            fi
            echo "Feed attempt $attempt failed; backing off..."
            sleep $((20 * attempt))
          done
          if [ "$success" -ne 1 ]; then
            echo 'Unable to obtain an acceptable XAUUSD M5 feed. No signal will be generated.'
            exit 1
          fi
          node - <<'NODE'
          const x = require('./xauusd_m5.json');
          const latest = x?.at?.(-1)?.time;
          const age = latest ? Date.now() - latest : NaN;
          if (!Array.isArray(x) || x.length < 1200) throw new Error(`Invalid M5 history: ${x?.length || 0}`);
          if (!Number.isFinite(age) || age < 0 || age > 20 * 60 * 1000) throw new Error(`Stale M5 data: ${Math.round(age/60000)}m`);
          console.log(`Validated ${x.length} M5 bars; latest=${new Date(latest).toISOString()}`);
          NODE

      - name: Detect XAUUSD market session
        shell: bash
        run: |
          set -euo pipefail
          hour=$(date -u +%H)
          if [ "$hour" = "21" ]; then
            echo 'XAUUSD_MARKET_OPEN=0' >> "$GITHUB_ENV"
            echo 'XAUUSD daily market break: 21:00-22:00 UTC. Feed is valid; analysis intentionally skipped.'
          else
            echo 'XAUUSD_MARKET_OPEN=1' >> "$GITHUB_ENV"
            echo 'XAUUSD market session active.'
          fi

      - name: Fetch fresh MT5 Order Flow (optional)
        if: env.XAUUSD_MARKET_OPEN != '0'
        env:
          MT5_ORDERFLOW_URL: ${{ secrets.MT5_ORDERFLOW_URL }}
          MT5_ORDERFLOW_KEY: ${{ secrets.MT5_ORDERFLOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f orderflow.json
          if [ -z "${MT5_ORDERFLOW_URL:-}" ]; then
            echo 'MT5 Order Flow unavailable/config not set; continuing without flow.'
            exit 0
          fi
          if [ -n "${MT5_ORDERFLOW_KEY:-}" ]; then
            curl -fsSL --max-time 10 -H "X-API-Key: ${MT5_ORDERFLOW_KEY}" "$MT5_ORDERFLOW_URL" -o orderflow.json || rm -f orderflow.json
          else
            curl -fsSL --max-time 10 "$MT5_ORDERFLOW_URL" -o orderflow.json || rm -f orderflow.json
          fi
          [ -f orderflow.json ] && echo 'Fresh MT5 Order Flow received.' || echo 'No fresh MT5 Order Flow; continuing without flow.'

      - name: Syntax and dependency checks
        run: |
          npm run check
          node --check server_v5.js
          node --check server_v6.js

      - name: Double-check SMC decision before Telegram
        if: env.XAUUSD_MARKET_OPEN != '0'
        env:
          SIGNAL_DRY_RUN: '1'
        shell: bash
        run: |
          set -euo pipefail
          node server_v6.js > /tmp/smc_check_1.log
          node server_v6.js > /tmp/smc_check_2.log
          echo '--- SMC check #1 ---'
          cat /tmp/smc_check_1.log
          echo '--- SMC check #2 ---'
          cat /tmp/smc_check_2.log
          s1=$(grep '^QUALIFYING SIGNAL:' /tmp/smc_check_1.log || true)
          s2=$(grep '^QUALIFYING SIGNAL:' /tmp/smc_check_2.log || true)
          if [ -n "$s1" ] || [ -n "$s2" ]; then
            [ -n "$s1" ] && [ -n "$s2" ] || { echo 'Inconsistent SMC result; Telegram blocked.'; exit 1; }
            [ "$s1" = "$s2" ] || { echo 'SMC checks disagree; Telegram blocked.'; exit 1; }
            echo 'SMC decision is deterministic and identical across both checks.'
          else
            echo 'Both SMC checks agree: no qualifying signal.'
          fi

      - name: Run XAUUSD V6 analysis and Telegram
        if: env.XAUUSD_MARKET_OPEN != '0'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server_v6.js

      - name: Commit state and refreshed candles
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xauusd_m5.json state_v2.json orderflow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'update XAUUSD V6 state [skip ci]'
            git push
          fi
