name: XAU-SMC Gold Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || { echo 'TELEGRAM_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }

      - name: Refresh XAUUSD M5 data
        shell: bash
        run: |
          set -euo pipefail
          URL='https://biquote.io/api/XAUUSD/ohlc?interval=5m&limit=1000'
          echo 'Fetching XAUUSD M5 candles from biquote...'
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
            -H 'Accept: application/json' \
            -A 'Gold-alert-bot/1.0' \
            "$URL" -o /tmp/xau.json
          node scripts/parse_yahoo_xau.js

      - name: Fetch fresh MT5 Order Flow (optional bridge)
        env:
          MT5_ORDERFLOW_URL: ${{ secrets.MT5_ORDERFLOW_URL }}
          MT5_ORDERFLOW_KEY: ${{ secrets.MT5_ORDERFLOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f orderflow.json
          if [ -z "${MT5_ORDERFLOW_URL:-}" ]; then
            echo 'MT5 Order Flow bridge is not configured; continuing with existing price/SMC policy.'
            exit 0
          fi
          echo 'Fetching fresh MT5 Order Flow...'
          if [ -n "${MT5_ORDERFLOW_KEY:-}" ]; then
            curl -fsSL --max-time 10 -H "X-API-Key: ${MT5_ORDERFLOW_KEY}" \
              "${MT5_ORDERFLOW_URL}" -o orderflow.json || {
                echo 'MT5 Order Flow unavailable; continuing without flow confirmation.'
                rm -f orderflow.json
              }
          else
            curl -fsSL --max-time 10 "${MT5_ORDERFLOW_URL}" -o orderflow.json || {
              echo 'MT5 Order Flow unavailable; continuing without flow confirmation.'
              rm -f orderflow.json
            }
          fi

      - name: Syntax and dependency checks
        run: npm run check

      - name: Run XAUUSD V4 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node orderflow_gate.js

      - name: Commit state and refreshed candles
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xauusd_m5.json state_v2.json orderflow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'update XAUUSD V4 state [skip ci]'
            git push
          fi
