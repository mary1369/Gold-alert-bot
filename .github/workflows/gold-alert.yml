name: XAU-SMC Gold Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: xau-smc-gold-alert
  cancel-in-progress: true

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send one-time Telegram connectivity test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -f telegram_test_sent.json ]; then
            echo "Telegram one-time test already sent; skipping."
            exit 0
          fi
          response=$(curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟢 Gold-alert-bot TEST | Telegram connection OK | One-time test | ${GITHUB_SHA:0:7}")
          echo "Telegram response received."
          printf '{"sent":true,"type":"connectivity-test"}\n' > telegram_test_sent.json

      - name: Run one-shot XAUUSD M5 analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node server.js

      - name: Commit state and one-time test marker
        shell: bash
        run: |
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xauusd_m5.json state_v2.json telegram_test_sent.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update XAUUSD alert state [skip ci]"
            git push
          fi
