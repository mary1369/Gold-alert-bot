name: V8 OB Confirmation RR2 Validation
on:
  push:
    paths:
      - 'backtest/v8_ob_confirmation_rr2_backtest.js'
      - '.github/workflows/v8-ob-confirmation-rr2.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node backtest/v8_ob_confirmation_rr2_backtest.js
      - uses: actions/upload-artifact@v4
        with:
          name: v8-ob-confirmation-rr2
          path: backtest/v8_ob_confirmation_rr2_result.json