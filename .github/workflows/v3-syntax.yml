name: V3 Syntax Check

on:
  push:
    paths:
      - 'server_v3.js'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server_v3.js syntax
        run: node --check server_v3.js
