name: V7.1 Independent IS OOS Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'strategy_v71.js'
      - 'backtest/v71_backtest.js'
      - '.github/workflows/v71-backtest.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependency
        run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Run V7.1 IS OOS
        run: node backtest/v71_backtest.js
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v71-backtest-result
          path: backtest/v71_result.json
      - name: Persist result
        run: |
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@github.com'
          git add backtest/v71_result.json
          git diff --cached --quiet || git commit -m 'persist V7.1 IS OOS result [skip ci]'
          git push

# validation rerun trigger