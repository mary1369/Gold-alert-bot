name: V8.1 Fixed Engine Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/v812_backtest.js'
      - '.github/workflows/v812-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Continuous causal backtest
        run: node backtest/v812_backtest.js
      - name: Look-ahead audit
        run: node backtest/v8_lookahead_audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: v812-validation
          path: backtest/v812_result.json
      - name: Persist result
        run: |
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@github.com'
          git add backtest/v812_result.json
          git diff --cached --quiet || git commit -m 'persist V8.1 fixed validation result [skip ci]'
          git push