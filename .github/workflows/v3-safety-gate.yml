name: V3 Safety Gate

on:
  push:
    paths:
      - 'server_v3.js'
      - 'orderflow/**'
      - '.github/workflows/v3-safety-gate.yml'
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check server_v3.js
      - name: Secret scan (source only)
        run: |
          ! grep -nE '(TELEGRAM_BOT_TOKEN|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' server_v3.js orderflow/*.js
      - name: Required safety gates
        run: |
          grep -q "const MIN_SCORE = 12" server_v3.js
          grep -q "!sw" server_v3.js
          grep -q "!ms" server_v3.js
          grep -q "!disp" server_v3.js
          grep -q "H4" server_v3.js
          grep -q "H1" server_v3.js
          grep -q "MSS" server_v3.js
          grep -q "1.618" server_v3.js
      - name: Confirm Order Flow is not fabricated by Dukascopy adapter
        run: |
          grep -q "isReal: false" orderflow/dukascopy_adapter.js
          grep -q "Live signal activation must remain disabled" orderflow/dukascopy_adapter.js
