name: Exact Trade Diagnostics
on:
  push:
    paths:
      - 'backtest/exact_trade_diagnostics.js'
      - 'server.js'
      - '.github/workflows/exact-trade-diagnostics.yml'
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dukascopy dependency
        run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Run exact diagnostics
        run: node backtest/exact_trade_diagnostics.js
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: exact-trade-diagnostics
          path: backtest/exact_trade_diagnostics.json
