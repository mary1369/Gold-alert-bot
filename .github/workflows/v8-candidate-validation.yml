name: V8 Candidate Relaxed Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'strategy_v8_candidate.js'
      - 'backtest/v8_candidate_backtest.js'
      - '.github/workflows/v8-candidate-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Candidate backtest
        run: node backtest/v8_candidate_backtest.js
      - name: Persist result
        run: |
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@github.com'
          git add backtest/v8_candidate_result.json
          git diff --cached --quiet || git commit -m 'persist V8 candidate validation result [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v8-candidate-validation
          path: backtest/v8_candidate_result.json
