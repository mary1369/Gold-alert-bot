name: V7 Two-Path IS OOS Backtest

on:
  push:
    branches: [v7-research]
    paths:
      - 'backtest/v7_two_path_backtest.js'
      - 'backtest/v7_two_path_engine.js'
      - '.github/workflows/v7-candidate-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dukascopy dependency
        run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Run V7 two-path IS OOS backtest
        run: node backtest/v7_two_path_backtest.js
        env:
          BT_DAYS: 180
      - name: Persist result
        run: |
          git config user.name 'gold-alert-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backtest/v7_two_path_result.json
          git commit -m 'persist V7 two-path IS OOS result [skip ci]' || echo 'No result changes to commit.'
          git push
