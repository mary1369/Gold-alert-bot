name: V4 Victoria Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/v4_victoria_hybrid.js'
      - 'backtest/v4_backtest.js'
      - '.github/workflows/v4-backtest.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 5-day XAUUSD M5 backtest
        run: node backtest/v4_backtest.js
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v4-backtest-result
          path: backtest/v4_result.json
# forced run after workflow creation
