name: V8 Core Edge Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
  push:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
# validation-only: branch-scoped; never writes main/production
jobs:
  holdout_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v8-core-edge
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Run frozen M15 holdout validation
        env:
          VALIDATION_MODE: blind_holdout
        run: node backtest/v8_core_edge_validation.js
      - name: Verify immutable blind holdout artifact
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('backtest/blind_holdout_manifest.json','utf8'));
          const e=JSON.parse(fs.readFileSync('backtest/blind_env.json','utf8'));
          const x=JSON.parse(fs.readFileSync('backtest/v8_blind_holdout_result.json','utf8'));
          if(m.schema!=='v8-blind-holdout-manifest-v1') throw new Error('bad manifest schema');
          if(JSON.stringify(e)!==JSON.stringify({BLIND_PREVIOUS_DATA_END:m.previousOosEnd,BLIND_START:m.blindStart,BLIND_END:m.blindEnd})) throw new Error('env/manifest mismatch');
          if(x.previousDataEnd!==m.previousOosEnd||x.blindStart!==m.blindStart||x.blindEnd!==m.blindEnd) throw new Error('result/manifest mismatch');
          if(JSON.stringify(x.frozenVariants)!==JSON.stringify([7,10])) throw new Error('variants not frozen');
          for(const s of ['7','10']) if(!x.variants[s] || !Array.isArray(x.variants[s].trades)) throw new Error('Missing trade-level variant '+s);
          for(const s of ['7','10']) for(const t of x.variants[s].trades){if(Date.parse(t.signalTime)<Date.parse(m.blindStart)||Date.parse(t.signalTime)>=Date.parse(m.blindEnd)) throw new Error('trade outside blind range');if(Date.parse(t.exitTime)>=Date.parse(m.blindEnd)) throw new Error('trade unresolved inside blind');}
          console.log('Immutable blind holdout verification: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v8-m15-blind-holdout-swing7-swing10
          path: |
            backtest/v8_blind_holdout_result.json
            backtest/blind_holdout_manifest.json
            backtest/blind_env.json
