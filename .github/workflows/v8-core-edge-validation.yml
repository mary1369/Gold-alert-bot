name: V8 Core Edge Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
  push:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
# validation-only: trigger run without touching main/production
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - run: node backtest/v8_core_edge_validation.js
      - uses: actions/upload-artifact@v4
        with:
          name: v8-core-edge-validation
          path: backtest/v8_core_edge_validation_result.json