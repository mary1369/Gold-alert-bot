name: V8 Core Edge Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
  push:
    paths:
      - 'backtest/v8_core_edge_validation.js'
      - '.github/workflows/v8-core-edge-validation.yml'
# validation-only: branch-scoped; never writes main/production
jobs:
  holdout_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v8-core-edge
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund dukascopy-node@1.50.0
      - name: Run frozen M15 holdout validation
        env:
          VALIDATION_MODE: blind_holdout
        run: node backtest/v8_core_edge_validation.js
      - name: Verify immutable blind holdout artifact
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='backtest/v8_blind_holdout_result.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.mode!=='BLIND_HOLDOUT_IMMUTABLE') throw new Error('Not immutable blind holdout');
          if(x.previousDataEnd!=='2026-09-06T12:30:00.000Z') throw new Error('Unexpected previous data boundary');
          if(x.blindStart!=='2026-09-06T12:45:00.000Z') throw new Error('Unexpected blind start');
          if(x.blindEnd!=='2026-09-06T16:00:00.000Z') throw new Error('Unexpected blind end');
          for(const s of ['7','10']) if(!x.variants[s] || !Array.isArray(x.variants[s].trades)) throw new Error('Missing trade-level variant '+s);
          console.log('Immutable blind holdout verification: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v8-m15-blind-holdout-swing7-swing10
          path: backtest/v8_blind_holdout_result.json
