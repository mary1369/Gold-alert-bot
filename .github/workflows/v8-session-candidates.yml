name: V8 Session Candidate Validation
on:
  push:
    paths:
      - 'backtest/v8_session_attribution.js'
      - '.github/workflows/v8-session-candidates.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node backtest/v8_session_attribution.js
      - uses: actions/upload-artifact@v4
        with:
          name: v8-session-candidates
          path: backtest/v8_session_attribution_result.json
